<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="AgroSmart: monitoreo y gestión ambiental agropecuaria dentro de NEOGRID.">
    <title>{{ page_title or 'AgroSmart' }} | AgroSmart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a class="brand" href="{{ url_for('main.home') }}" aria-label="AgroSmart, inicio">
                <span class="brand-mark">A</span>
                <span class="brand-copy"><strong>AGROSMART</strong><small>NEOGRID · CIUDAD INTELIGENTE</small></span>
            </a>
            <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Abrir menú">☰</button>
            <nav class="site-nav" id="site-nav">
                <a href="{{ url_for('main.home') }}" {% if request.endpoint == 'main.home' %}aria-current="page"{% endif %}>Inicio</a>
                <a href="{{ url_for('project.overview') }}" {% if request.blueprint == 'project' %}aria-current="page"{% endif %}>Proyecto</a>
                <a href="{{ url_for('monitoring.dashboard') }}" {% if request.blueprint == 'monitoring' %}aria-current="page"{% endif %}>Monitoreo</a>
                <a href="{{ url_for('analytics.dashboard') }}" {% if request.blueprint == 'analytics' %}aria-current="page"{% endif %}>Analítica</a>
                <a href="{{ url_for('main.about') }}" {% if request.endpoint == 'main.about' %}aria-current="page"{% endif %}>Acerca de</a>
            </nav>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <div><strong>AGROSMART</strong><p>Sistema de monitoreo y gestión ambiental agropecuaria.</p></div>
            <span>Proyecto académico · NEOGRID</span>
        </div>
    </footer>
    <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
</body>
</html>
